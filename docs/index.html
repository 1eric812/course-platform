<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-density="standard" data-font="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>选课平台 · Course Selection</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn nav-toggle" id="navToggle" aria-label="展开导航">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <span class="icon-btn-text">菜单</span>
  </button>
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">选课平台</span></div>
  <div class="topbar-search">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" class="search-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="globalSearch" type="search" placeholder="搜索课程名称 / 课程号 / 教师" autocomplete="off">
  </div>
  <div class="topbar-right">
    <div class="role-switch" id="roleSwitch" role="group" aria-label="切换角色">
      <button class="role-btn active" data-role="student">学生</button>
      <button class="role-btn" data-role="teacher">教师</button>
      <button class="role-btn" data-role="admin">教务</button>
    </div>
    <div class="countdown-chip" title="距选课开放"><span class="cd-dot" aria-hidden="true"></span><span id="topCountdownText">--:--</span></div>
    <div class="user-chip" id="userChip" title="当前账号（点击进入个人中心）">
      <span class="avatar" id="userAvatar">?</span>
      <span class="user-name" id="userName">…</span>
    </div>
    <button class="icon-btn" id="themeToggle" aria-label="切换深色模式">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
      <span class="icon-btn-text">深色</span>
    </button>
  </div>
</header>

<div class="layout">
  <nav class="sidenav" id="sidenav" aria-label="主导航">
    <ul id="navList"></ul>
    <div class="sidenav-foot">
      <div class="credit-meter">
        <div class="cm-head"><span>已选学分</span><span id="creditText">0 / 30</span></div>
        <div class="cm-track"><i id="creditBar"></i></div>
      </div>
    </div>
  </nav>
  <main class="main" id="main"><div id="view"></div></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="modal-root" id="modalRoot"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
