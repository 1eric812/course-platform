server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: course-platform-server

  # ---------- 数据源（支持环境变量覆盖，方便容器/云平台部署） ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/course_platform?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:root}}
    hikari:
      pool-name: CoursePlatformHikari
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: -1

  # ---------- SQL 初始化脚本 ----------
  # 数据库由 docker-entrypoint-initdb.d 或 reset-db-java.mjs 初始化，应用内不重复执行
  sql:
    init:
      mode: never

  # ---------- 静态资源：托管前端 ----------
  # 本地开发：server-java 的上一级是 client/
  # 容器部署：Dockerfile 把 client 放到 /client，工作目录 /app 时 ../client = /client
  web:
    resources:
      static-locations: file:${CLIENT_DIR:../client/}
      cache:
        period: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.courseplatform.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true

# ---------- 业务参数 ----------
course-platform:
  demo:
    open-delay-ms: 90000
    seat-tick-ms: 4000
    process-delay-ms: 900
  auth:
    token-ttl-seconds: 7200
    # JWT 签名密钥（HS256，长度需 ≥ 32 字节）；生产环境务必用环境变量覆盖
    jwt-secret: ${JWT_SECRET:course-platform-demo-secret-key-please-change-in-prod-2026}

logging:
  level:
    root: info
    com.courseplatform: debug
